# Railway configuration for the Hermes Agent deployment.
# Uses Dockerfile.railway instead of the default Dockerfile to layer
# Tailscale on top of the upstream nousresearch/hermes-agent image.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.railway"

# Do NOT set startCommand here. Railway treats startCommand as a full
# replacement for the image's ENTRYPOINT + CMD, which bypasses
# Dockerfile.railway's tini + entrypoint-railway.sh wrapper (and therefore
# skips Tailscale bring-up and Codex auth bootstrap). The Dockerfile
# already declares both ENTRYPOINT and CMD ["gateway", "run"] — Railway
# will use those when startCommand is omitted.
[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
